# Keep the OpenRouter key in a file instead of .env:
#   docker compose -f compose.yaml -f compose.secrets.yaml up -d --build
services:
  worker:
    environment:
      OPENROUTER_API_KEY: ""
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - openrouter_api_key
secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key
